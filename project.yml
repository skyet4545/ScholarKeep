name: ScholarKeep
options:
  bundleIdPrefix: com.carlosreyes
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "16"
    SCHOLARKEEP_GOOGLE_CLIENT_ID: ""
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "846N5D6TMK"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  ScholarKeep:
    type: application
    platform: iOS
    sources:
      - path: ScholarKeep
        excludes:
          - "**/.DS_Store"
    resources:
      - path: ScholarKeep/Resources/Assets.xcassets
    dependencies:
      - target: ScholarKeepShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlosreyes.scholarkeep
        PRODUCT_NAME: ScholarKeep
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScholarKeep/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: ScholarKeep/ScholarKeep.entitlements

  ScholarKeepShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ScholarKeepShareExtension
        excludes:
          - "Info.plist"
      - path: ScholarKeep/Shared/ShareInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlosreyes.scholarkeep.share
        PRODUCT_NAME: ScholarKeepShare
        CODE_SIGN_ENTITLEMENTS: ScholarKeepShareExtension/ShareExtension.entitlements
        INFOPLIST_FILE: ScholarKeepShareExtension/Info.plist
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  ScholarKeepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ScholarKeepTests
    dependencies:
      - target: ScholarKeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlosreyes.scholarkeep.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScholarKeep.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ScholarKeep"
  ScholarKeepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ScholarKeepUITests
    dependencies:
      - target: ScholarKeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlosreyes.scholarkeep.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScholarKeep

schemes:
  ScholarKeep:
    build:
      targets:
        ScholarKeep: all
        ScholarKeepTests: [test]
        ScholarKeepUITests: [test]
    test:
      targets:
        - ScholarKeepTests
        - ScholarKeepUITests
      gatherCoverageData: true
